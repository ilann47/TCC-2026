name: Java prototype

on:
  push:
    branches: [main]
    paths: ["implementacao-java/**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["implementacao-java/**", ".github/workflows/java.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: implementacao-java/pom.xml
      - name: Testes unitários e empacotamento
        working-directory: implementacao-java
        run: ./mvnw -B verify

  integration-smoke:
    runs-on: ubuntu-latest
    needs: unit
    env:
      POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Subir serviços isolados
        working-directory: implementacao-java
        run: docker compose up --build -d
      - name: Exercitar as variantes e a persistência final
        working-directory: implementacao-java
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, uuid
          def call(url, data=None):
              body = None if data is None else json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request(url, data=body, headers={'Content-Type':'application/json'}), timeout=8) as response:
                  return response.status, json.load(response)
          def ready(port):
              for _ in range(90):
                  try:
                      if call(f'http://127.0.0.1:{port}/health')[0] == 200: return
                  except OSError: pass
                  time.sleep(2)
              raise AssertionError(f'service {port} not ready')
          ready(18002); ready(18003)
          for port, expected_title, success_code in (
              (18002, 'Auditoria - API sincrona', '201'),
              (18003, 'Auditoria - API assincrona', '202'),
          ):
              status, spec = call(f'http://127.0.0.1:{port}/v3/api-docs')
              assert status == 200 and spec['info']['title'] == expected_title, spec.get('info')
              assert success_code in spec['paths']['/audit']['post']['responses']
              with urllib.request.urlopen(f'http://127.0.0.1:{port}/swagger-ui/index.html', timeout=8) as response:
                  assert response.status == 200
          base = dict(event_type='created', entity_type='order', entity_id='E1', actor_id='A1', source='ci', occurred_at='2026-09-29T12:34:56Z', payload={'value':1})
          sync = dict(base, event_id=str(uuid.uuid4()))
          status, result = call('http://127.0.0.1:18002/audit', sync)
          assert status == 201 and result['status'] == 'persisted', result
          status, result = call('http://127.0.0.1:18002/audit', sync)
          assert status == 201 and result['status'] == 'duplicate', result
          async_event = dict(base, event_id=str(uuid.uuid4()))
          status, result = call('http://127.0.0.1:18003/audit', async_event)
          assert status == 202 and result['status'] == 'accepted', result
          for _ in range(60):
              try:
                  status, result = call(f"http://127.0.0.1:18002/audit/{async_event['event_id']}")
                  if status == 200:
                      assert result['status'] == 'persisted', result
                      break
              except OSError: pass
              time.sleep(1)
          else: raise AssertionError('asynchronous event was not persisted')
          print('Java REST/Kafka/PostgreSQL smoke passed')
          PY
      - name: Smoke C4 - PostgreSQL indisponível e recuperação
        working-directory: implementacao-java
        run: |
          docker compose stop postgres
          python3 - <<'PY'
          import json, time, urllib.request, uuid
          from urllib.error import HTTPError
          def post(port, event):
              request = urllib.request.Request(f'http://127.0.0.1:{port}/audit', data=json.dumps(event).encode(), headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=8) as response: return response.status
              except HTTPError as error: return error.code
          base = dict(event_type='created', entity_type='order', entity_id='C4', actor_id='A1', source='ci-c4', occurred_at='2026-09-29T12:34:56Z', payload={'value':2})
          for _ in range(15):
              try:
                  if post(18002, dict(base, event_id=str(uuid.uuid4()))) == 503: break
              except OSError: pass
              time.sleep(1)
          else: raise AssertionError('synchronous variant did not signal unavailable database')
          assert post(18003, dict(base, event_id=str(uuid.uuid4()))) == 202
          print('C4 acceptance contrast passed; this is not a definitive experiment')
          PY
          docker compose start postgres
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18002/health', timeout=5) as response:
                      if response.status == 200: break
              except OSError: pass
              time.sleep(1)
          else: raise AssertionError('PostgreSQL recovery was not observed by synchronous API')
          print('PostgreSQL recovery smoke passed')
          PY
      - name: Diagnóstico em falha
        if: failure()
        working-directory: implementacao-java
        run: docker compose ps && docker compose logs --tail=150
      - name: Encerrar serviços
        if: always()
        working-directory: implementacao-java
        run: docker compose down
