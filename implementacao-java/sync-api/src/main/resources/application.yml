server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auditdb?connectTimeout=5&socketTimeout=5&options=-c%20statement_timeout=5000%20-c%20lock_timeout=5000%20-c%20synchronous_commit=on}
    username: ${SPRING_DATASOURCE_USERNAME:audit}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    urls:
      - name: "Síncrona (PostgreSQL)"
        url: /v3/api-docs
      - name: "Assíncrona (Kafka)"
        url: ${SWAGGER_ASYNC_DOCS_URL:http://localhost:18003/v3/api-docs}
    urls-primary-name: "Síncrona (PostgreSQL)"
