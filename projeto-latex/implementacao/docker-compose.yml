name: tcc-revisao-20260907
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditdb
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local experimental PostgreSQL password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d auditdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /kafka-data"]
    volumes:
      - kafka-data:/kafka-data

  kafka:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:9094"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-events-dlq --partitions 1 --replication-factor 1

  sync-api:
    build: .
    command: uvicorn app.sync_api.main:app --host 0.0.0.0 --port 8000 --no-access-log
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://audit:${POSTGRES_PASSWORD:?Set a local experimental PostgreSQL password}@postgres:5432/auditdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: audit-events
      KAFKA_DLQ_TOPIC: audit-events-dlq
      DELIVERY_TIMEOUT_SECONDS: ${DELIVERY_TIMEOUT_SECONDS:-10}
      DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-5}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-0.5}
      RETRY_BACKOFF_MAX_SECONDS: ${RETRY_BACKOFF_MAX_SECONDS:-5}
      RECONNECT_SECONDS: ${RECONNECT_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SYNC_PORT:-18000}:8000"
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=6)"]
      interval: 10s
      timeout: 7s
      retries: 6

  async-api:
    build: .
    command: uvicorn app.async_api.main:app --host 0.0.0.0 --port 8001 --no-access-log
    environment: *app-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ASYNC_PORT:-18001}:8001"
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6

  consumer:
    build: .
    command: python -m app.consumer.main
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 256m

  tests:
    profiles: ["tests"]
    build: .
    command: python -m pytest -v -m integration
    environment:
      <<: *app-env
      RUN_INTEGRATION: "1"
      SYNC_BASE_URL: http://sync-api:8000
      ASYNC_BASE_URL: http://async-api:8001
    depends_on:
      sync-api:
        condition: service_healthy
      async-api:
        condition: service_healthy
      consumer:
        condition: service_started

volumes:
  postgres-data:
  kafka-data:
